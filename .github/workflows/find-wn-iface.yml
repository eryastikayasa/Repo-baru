name: Print ESP32-S3 esp_wn_iface.h

on: workflow_dispatch

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: espressif/esp-sr
          ref: 5fadfbd5bd9df756f543973bd43520d9270ffb1b
          path: esp-sr

      - name: Print esp_wn_iface.h (ESP32-S3)
        run: |
          FILE="esp-sr/include/esp32s3/esp_wn_iface.h"
          echo "=== File: $FILE ==="
          sed -n '1,260p' "$FILE"

      - name: Search model_iface_data_t definition (all headers)
        run: |
          echo "=== Searching model_iface_data_t ==="
          grep -R -n -B5 -A30 "model_iface_data_t" esp-sr --include='*.h' | head -300

      - name: Search model_coeff_getter_t definition (all headers)
        run: |
          echo "=== Searching model_coeff_getter_t ==="
          grep -R -n -B5 -A30 "model_coeff_getter_t" esp-sr --include='*.h' | head -300
