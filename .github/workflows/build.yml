name: Build ESP32-S3 Firmware

on:
  push:
    branches:
      - main
      - fix/geminiproject
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_srmodel:
    name: Build ESP-SR WakeNet9 model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build official ESP-SR model image
        env:
          ESP_SR_VERSION: v2.4.5
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$ESP_SR_VERSION" https://github.com/espressif/esp-sr.git /tmp/esp-sr

          MODEL_SRC=/tmp/esp-sr/model/wakenet_model/wn9_hiesp
          MODEL_ROOT=$PWD/srmodel-build
          MODEL_DST=$MODEL_ROOT/wn9_hiesp

          test -d "$MODEL_SRC"
          test -f "$MODEL_SRC/wn9_index"
          test -f "$MODEL_SRC/wn9_data"

          rm -rf "$MODEL_ROOT"
          mkdir -p "$MODEL_ROOT"
          cp -a "$MODEL_SRC" "$MODEL_DST"

          # Use Espressif's official pack_model.py directly.
          # This avoids movemodel.py's sdkconfig parser and deliberately
          # packages only the selected WakeNet9 Hi ESP model.
          python -u /tmp/esp-sr/model/pack_model.py \
            -m "$MODEL_ROOT" \
            -o srmodels.bin

          MODEL_BIN="$MODEL_ROOT/srmodels.bin"
          test -s "$MODEL_BIN"
          grep -a -q "wn9_hiesp" "$MODEL_BIN"
          SIZE=$(stat -c %s "$MODEL_BIN")
          test "$SIZE" -le $((0x400000))

          echo "ESP-SR version: $ESP_SR_VERSION"
          echo "Model source: $MODEL_SRC"
          echo "Model image: $MODEL_BIN"
          echo "Model size: $SIZE bytes"
          sha256sum "$MODEL_BIN"
          echo "ESP-SR WakeNet9 Hi ESP model: PASS"

      - name: Upload ESP-SR model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP-SR-WakeNet9-HiESP-v2.4.5
          if-no-files-found: error
          path: srmodel-build/srmodels.bin

  build_firmware:
    name: Build ESP32-S3 firmware
    needs: build_srmodel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PlatformIO
        run: pip install platformio

      - name: Check PlatformIO
        run: pio --version

      - name: Check Build Environment
        run: |
          set -euo pipefail
          pio platform show espressif32
          pio pkg list
          pio run -t clean

      - name: Download prebuilt official ESP-SR model
        uses: actions/download-artifact@v4
        with:
          name: ESP-SR-WakeNet9-HiESP-v2.4.5
          path: model-artifact

      - name: Stage ESP-SR model before CMake configure
        run: |
          set -euo pipefail
          MODEL_ARTIFACT="$PWD/model-artifact/srmodels.bin"
          BUILD="$PWD/.pio/build/esp32-s3-devkitc-1"
          MODEL_OUT="$BUILD/srmodels/srmodels.bin"

          test -s "$MODEL_ARTIFACT"
          mkdir -p "$(dirname "$MODEL_OUT")"
          cp "$MODEL_ARTIFACT" "$MODEL_OUT"

          echo "Pre-seeded ESP-SR model: $MODEL_OUT"
          stat "$MODEL_OUT"
          sha256sum "$MODEL_OUT"

      - name: Build ESP32-S3
        run: pio run

      - name: Audit final sdkconfig, 16MB flash and WakeNet9
        run: |
          set -euo pipefail
          BUILD=.pio/build/esp32-s3-devkitc-1
          test -d "$BUILD"
          if [ -f sdkconfig ]; then SDKCONFIG=sdkconfig; else SDKCONFIG="$(find . -maxdepth 1 -type f -name 'sdkconfig.*' ! -name 'sdkconfig.defaults' -print -quit)"; fi
          test -n "$SDKCONFIG" && test -f "$SDKCONFIG"
          echo "Final sdkconfig: $SDKCONFIG"
          grep -E '^CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y$' "$SDKCONFIG"
          grep -E '^CONFIG_ESPTOOLPY_FLASHSIZE=\"16MB\"$' "$SDKCONFIG"
          grep -E '^CONFIG_PARTITION_TABLE_CUSTOM=y$' "$SDKCONFIG"
          grep -E '^CONFIG_PARTITION_TABLE_CUSTOM_FILENAME=\"partitions/partitions.csv\"$' "$SDKCONFIG"
          grep -E '^model,.*0x400000' partitions/partitions.csv
          grep -E '^CONFIG_SR_WN_WN9_HIESP=y$' "$SDKCONFIG"
          test -f "$BUILD/firmware.bin"
          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.elf"
          test -s "$BUILD/srmodels/srmodels.bin"
          cmp "$BUILD/srmodels/srmodels.bin" model-artifact/srmodels.bin
          grep -a -q "wn9_hiesp" "$BUILD/srmodels/srmodels.bin"
          echo "Flash size: 16MB PASS"
          echo "Custom partition table: PASS"
          echo "WakeNet9 Hi ESP config: PASS"
          echo "Prebuilt ESP-SR model retained by CMake: PASS"
          echo "Model artifact matches firmware build: PASS"

      - name: Audit final sdkconfig and CA bundle
        run: |
          set -euo pipefail
          BUILD=.pio/build/esp32-s3-devkitc-1
          if [ -f sdkconfig ]; then SDKCONFIG=sdkconfig; else SDKCONFIG="$(find . -maxdepth 1 -type f -name 'sdkconfig.*' ! -name 'sdkconfig.defaults' -print -quit)"; fi
          ELF="$BUILD/firmware.elf"
          grep -E '^(CONFIG_MBEDTLS_CERTIFICATE_BUNDLE|CONFIG_MBEDTLS_DEFAULT_CERTIFICATE_BUNDLE|CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL|CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_CROSS_SIGNED_VERIFY)=' "$SDKCONFIG"
          test "$(grep -E '^CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y$' "$SDKCONFIG" | wc -l)" -eq 1
          test "$(grep -E '^CONFIG_MBEDTLS_DEFAULT_CERTIFICATE_BUNDLE=y$' "$SDKCONFIG" | wc -l)" -eq 1
          test "$(grep -E '^CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=y$' "$SDKCONFIG" | wc -l)" -eq 1
          test "$(grep -E '^CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_CROSS_SIGNED_VERIFY=y$' "$SDKCONFIG" | wc -l)" -eq 1
          readelf -Ws "$ELF" | grep -E '_binary_x509_crt_bundle_(start|end)'
          test "$(readelf -Ws "$ELF" | grep -c '_binary_x509_crt_bundle_start')" -ge 1
          test "$(readelf -Ws "$ELF" | grep -c '_binary_x509_crt_bundle_end')" -ge 1
          echo "CA bundle Kconfig: PASS"
          echo "Embedded x509 certificate bundle: PASS"

      - name: Final compatibility gate
        run: |
          set -euo pipefail
          BUILD=.pio/build/esp32-s3-devkitc-1
          test -f "$BUILD/firmware.bin"
          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.elf"
          test -f "$BUILD/srmodels/srmodels.bin"
          echo "========================================"
          echo "COMPATIBILITY GATE: PASS"
          echo "ESP32-S3 + 16MB Flash + 8MB OPI PSRAM"
          echo "ESP-IDF 6.0.1 + ESP-SR 2.4.5"
          echo "WakeNet9 Hi ESP + official packed model"
          echo "CA bundle + embedded TLS trust store"
          echo "========================================"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-Firmware-Full
          if-no-files-found: error
          path: |
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            .pio/build/esp32-s3-devkitc-1/bootloader.bin
            .pio/build/esp32-s3-devkitc-1/partitions.bin
            .pio/build/esp32-s3-devkitc-1/firmware.elf
            .pio/build/esp32-s3-devkitc-1/srmodels/srmodels.bin
