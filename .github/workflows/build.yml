name: Build ESP32-S3 Firmware

on:
  push:
    branches:
      - main
      - fix/geminiproject
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PlatformIO
        run: pip install platformio

      - name: Check PlatformIO
        run: pio --version

      - name: Check Build Environment
        run: |
          set -euo pipefail
          pio platform show espressif32
          pio pkg list
          pio run -t clean
          pio run

      - name: Build ESP32-S3
        run: pio run

      # ============================================================
      # AUDIT 1: FINAL SDKCONFIG / FLASH / WAKEWORD
      # ============================================================
      - name: Audit final sdkconfig, 16MB flash and WakeNet9
        run: |
          set -euo pipefail
          BUILD=.pio/build/esp32-s3-devkitc-1
          test -d "$BUILD"

          if [ -f sdkconfig ]; then
            SDKCONFIG=sdkconfig
          else
            SDKCONFIG="$(find . -maxdepth 1 -type f -name 'sdkconfig.*' ! -name 'sdkconfig.defaults' -print -quit)"
          fi
          test -n "$SDKCONFIG"
          test -f "$SDKCONFIG"
          echo "Final sdkconfig: $SDKCONFIG"

          echo "--- Flash configuration ---"
          grep -E '^CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y$' "$SDKCONFIG"
          grep -E '^CONFIG_ESPTOOLPY_FLASHSIZE=\"16MB\"$' "$SDKCONFIG"

          echo "--- Custom partition configuration ---"
          grep -E '^CONFIG_PARTITION_TABLE_CUSTOM=y$' "$SDKCONFIG"
          grep -E '^CONFIG_PARTITION_TABLE_CUSTOM_FILENAME=\"partitions/partitions.csv\"$' "$SDKCONFIG"

          echo "--- WakeNet configuration ---"
          grep -E '^CONFIG_SR_WN_WN9_HIESP=y$' "$SDKCONFIG"

          test -f "$BUILD/firmware.bin"
          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.elf"

          echo "Flash size: 16MB PASS"
          echo "Custom partition table: PASS"
          echo "WakeNet9 Hi ESP config: PASS"

      # ============================================================
      # AUDIT 2: ESP-SR NATIVE MODEL PACKER
      # ============================================================
      - name: Generate or locate ESP-SR srmodels.bin
        run: |
          set -euo pipefail
          BUILD=.pio/build/esp32-s3-devkitc-1

          # ESP-SR 2.4.1 creates this through its CMake target when the
          # project is built/flashed with ESP-IDF. PlatformIO may not invoke
          # the flash target, so first look for the native output.
          MODEL_BIN="$(find "$BUILD" -type f -path '*/srmodels/srmodels.bin' -print -quit || true)"

          if [ -z "$MODEL_BIN" ]; then
            if [ -f sdkconfig ]; then
              SDKCONFIG=sdkconfig
            else
              SDKCONFIG="$(find . -maxdepth 1 -type f -name 'sdkconfig.*' ! -name 'sdkconfig.defaults' -print -quit)"
            fi
            test -f "$SDKCONFIG"

            # PlatformIO/ESP-IDF component-manager locations vary. Discover
            # the official ESP-SR model packer instead of assuming a .pio path.
            ESP_SR_MOVEMODEL="$(find .pio "$HOME/.platformio" -type f -path '*/esp-sr/model/movemodel.py' -print -quit 2>/dev/null || true)"
            if [ -z "$ESP_SR_MOVEMODEL" ]; then
              ESP_SR_MOVEMODEL="$(find .pio "$HOME/.platformio" -type f -name 'movemodel.py' -print -quit 2>/dev/null || true)"
            fi

            test -n "$ESP_SR_MOVEMODEL"
            test -f "$ESP_SR_MOVEMODEL"

            # movemodel.py lives at <esp-sr-component>/model/movemodel.py.
            ESP_SR_DIR="$(dirname "$(dirname "$ESP_SR_MOVEMODEL")")"
            test -f "$ESP_SR_DIR/model/movemodel.py"
            test -d "$ESP_SR_DIR/model/wakenet_model"

            echo "Using final sdkconfig: $SDKCONFIG"
            echo "Using official ESP-SR model packer: $ESP_SR_MOVEMODEL"
            echo "Using ESP-SR component: $ESP_SR_DIR"

            # This is the same command used by ESP-SR's CMakeLists.txt.
            python "$ESP_SR_MOVEMODEL" \
              -d1 "$SDKCONFIG" \
              -d2 "$ESP_SR_DIR" \
              -d3 "$BUILD"

            MODEL_BIN="$BUILD/srmodels/srmodels.bin"
          fi

          test -f "$MODEL_BIN"
          MODEL_BIN="$(realpath "$MODEL_BIN")"
          MODEL_SIZE="$(stat -c %s "$MODEL_BIN")"

          echo "ESP-SR model image: $MODEL_BIN"
          echo "ESP-SR model size: $MODEL_SIZE bytes"

          # model partition is 0x100000 = 1 MiB in this project.
          test "$MODEL_SIZE" -gt 0
          test "$MODEL_SIZE" -le $((0x100000))

          # The packer should leave the selected WakeNet model directory.
          test -d "$BUILD/srmodels/wn9_hiesp"
          test -f "$BUILD/srmodels/wn9_hiesp/wn9_index"

          echo "WakeNet9 model image: PASS"
          echo "Model partition capacity (1MiB): PASS"

      # ============================================================
      # AUDIT 3: FINAL SDKCONFIG + EMBEDDED CA BUNDLE
      # ============================================================
      - name: Audit final sdkconfig and CA bundle
        run: |
          set -euo pipefail
          BUILD=.pio/build/esp32-s3-devkitc-1
          if [ -f sdkconfig ]; then
            SDKCONFIG=sdkconfig
          else
            SDKCONFIG="$(find . -maxdepth 1 -type f -name 'sdkconfig.*' ! -name 'sdkconfig.defaults' -print -quit)"
          fi
          ELF="$BUILD/firmware.elf"

          echo "--- CA bundle configuration in final sdkconfig ---"
          grep -E '^(CONFIG_MBEDTLS_CERTIFICATE_BUNDLE|CONFIG_MBEDTLS_DEFAULT_CERTIFICATE_BUNDLE|CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL|CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_CROSS_SIGNED_VERIFY)=' "$SDKCONFIG"

          test "$(grep -E '^CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y$' "$SDKCONFIG" | wc -l)" -eq 1
          test "$(grep -E '^CONFIG_MBEDTLS_DEFAULT_CERTIFICATE_BUNDLE=y$' "$SDKCONFIG" | wc -l)" -eq 1
          test "$(grep -E '^CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=y$' "$SDKCONFIG" | wc -l)" -eq 1
          test "$(grep -E '^CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_CROSS_SIGNED_VERIFY=y$' "$SDKCONFIG" | wc -l)" -eq 1

          # Inspect the actual ELF. This is stronger than checking defaults:
          # the embedded x509 bundle must exist in the linked firmware.
          readelf -Ws "$ELF" | grep -E '_binary_x509_crt_bundle_(start|end)'
          test "$(readelf -Ws "$ELF" | grep -c '_binary_x509_crt_bundle_start')" -ge 1
          test "$(readelf -Ws "$ELF" | grep -c '_binary_x509_crt_bundle_end')" -ge 1

          echo "CA bundle Kconfig: PASS"
          echo "Embedded x509 certificate bundle: PASS"

      # ============================================================
      # FINAL GATE
      # ============================================================
      - name: Final compatibility gate
        run: |
          set -euo pipefail
          BUILD=.pio/build/esp32-s3-devkitc-1
          test -f "$BUILD/firmware.bin"
          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.elf"
          test -f "$BUILD/srmodels/srmodels.bin"
          echo "========================================"
          echo "COMPATIBILITY GATE: PASS"
          echo "ESP-IDF 6.0.1 + ESP-SR 2.4.1"
          echo "16MB flash + custom model partition"
          echo "WakeNet9 Hi ESP + srmodels.bin"
          echo "CA bundle + embedded TLS trust store"
          echo "========================================"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-Firmware-Full
          if-no-files-found: error
          path: |
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            .pio/build/esp32-s3-devkitc-1/bootloader.bin
            .pio/build/esp32-s3-devkitc-1/partitions.bin
            .pio/build/esp32-s3-devkitc-1/firmware.elf
            .pio/build/esp32-s3-devkitc-1/srmodels/srmodels.bin
