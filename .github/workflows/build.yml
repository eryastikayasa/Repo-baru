name: Build ESP32-S3 Firmware

on:
  push:
    branches:
      - main
      - fix/geminiproject
      - feature/wakeword-alexa
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build ESP32-S3 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PlatformIO
        run: pip install platformio

      - name: Check PlatformIO
        run: pio --version

      - name: Check Build Environment
        run: |
          set -euo pipefail
          pio platform show espressif32
          pio pkg list

      - name: Prepare Gemini API key header
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          printf '#pragma once\n#define GEMINI_API_KEY "%s"\n' "$GEMINI_API_KEY" > components/websocket/include/gemini_api_key.h
          test -s components/websocket/include/gemini_api_key.h
          echo "Gemini API key header: PASS"

      - name: Clean build
        run: pio run -t clean

      - name: Build ESP32-S3
        run: pio run

      - name: Ensure ESP-SR model image exists
        run: |
          set -euo pipefail

          BUILD=.pio/build/esp32-s3-devkitc-1
          test -d "$BUILD"

          if [ -f sdkconfig ]; then
            SDKCONFIG=sdkconfig
          else
            SDKCONFIG="$(find . -maxdepth 1 -type f -name 'sdkconfig.*' ! -name 'sdkconfig.defaults' -print -quit)"
          fi
          test -f "$SDKCONFIG"

          MODEL="$BUILD/srmodels/srmodels.bin"
          MOVEMODEL="$(find managed_components .pio/build/esp32-s3-devkitc-1/managed_components -type f -path '*/espressif__esp-sr/model/movemodel.py' -print -quit 2>/dev/null || true)"
          if [ -z "$MOVEMODEL" ]; then
            MOVEMODEL="$(find managed_components .pio/build/esp32-s3-devkitc-1/managed_components -type f -path '*/esp-sr/model/movemodel.py' -print -quit 2>/dev/null || true)"
          fi

          if [ -s "$MODEL" ]; then
            echo "ESP-SR model image already generated by the build: $MODEL"
          else
            test -n "$MOVEMODEL"
            test -f "$MOVEMODEL"
            ESP_SR="$(dirname "$(dirname "$MOVEMODEL")")"
            echo "ESP-SR movemodel.py: $MOVEMODEL"
            echo "ESP-SR component root: $ESP_SR"
            echo "Generating srmodels.bin from the exact resolved ESP-SR component and final sdkconfig..."
            python "$MOVEMODEL" -d1 "$SDKCONFIG" -d2 "$ESP_SR" -d3 "$BUILD"
          fi

          test -s "$MODEL"
          echo "ESP-SR model image: $MODEL"
          stat -c 'Model size: %s bytes' "$MODEL"

      - name: Diagnose exact ESP-SR WakeNet source mapping from ELF
        run: |
          set -euo pipefail

          BUILD=.pio/build/esp32-s3-devkitc-1
          ELF="$BUILD/firmware.elf"
          REPORT=sr-wakenet-diagnostic.txt
          mkdir -p sr-source

          echo "=== ESP-SR source files physically shipped in workspace/cache ===" | tee "$REPORT"
          find "$GITHUB_WORKSPACE" "$HOME/.platformio" -type f \
            \( -name 'wakenet9_quantized.c' -o -name 'wakenet9l_quantized.c' \) \
            -print 2>/dev/null | sort -u | tee -a "$REPORT" || true

          echo "=== NOTE ===" | tee -a "$REPORT"
          echo "ESP-SR 2.4.6 may ship the WakeNet implementation as a prebuilt binary, so the original .c file is not necessarily present." | tee -a "$REPORT"
          echo "The ELF DWARF line information is authoritative for the exact firmware that was built." | tee -a "$REPORT"

          TOOLROOT="$HOME/.platformio/packages"
          ADDR2LINE=$(find "$TOOLROOT" -type f \
            \( -name 'xtensa-esp32s3-elf-addr2line' -o -name 'xtensa-esp-elf-addr2line' -o -name 'xtensa-esp32-elf-addr2line' \) \
            -print -quit)
          OBJDUMP=$(find "$TOOLROOT" -type f \
            \( -name 'xtensa-esp32s3-elf-objdump' -o -name 'xtensa-esp-elf-objdump' -o -name 'xtensa-esp32-elf-objdump' \) \
            -print -quit)

          test -n "$ADDR2LINE"
          test -n "$OBJDUMP"

          {
            echo
            echo "=== EXACT ADDR2LINE ==="
            "$ADDR2LINE" -e "$ELF" -f -C -p \
              0x4205fef8 0x4205fef5 0x42060564 0x420034bd \
              0x42003d95 0x42013520 0x420c6686

            echo
            echo "=== SYMBOLS: WakeNet model_create ==="
            "$OBJDUMP" -t "$ELF" | grep -E 'model_create|wakenet9(_quantized)?|wakenet9l' | head -n 160 || true

            echo
            echo "=== DISASSEMBLY 0x4205fee0..0x4205ff30 ==="
            "$OBJDUMP" -d --start-address=0x4205fee0 --stop-address=0x4205ff30 "$ELF"

            echo
            echo "=== DWARF LINE TABLE: wakenet9_quantized.c ==="
            "$OBJDUMP" --dwarf=decodedline "$ELF" 2>/dev/null | grep -A8 -B8 'wakenet9_quantized.c' | head -n 160 || true
          } | tee -a "$REPORT"

          cp "$REPORT" sr-source/sr-wakenet-diagnostic.txt

      - name: Audit ESP-SR 2.4.6 WakeNet9 Alexa build output
        run: |
          set -euo pipefail

          BUILD=.pio/build/esp32-s3-devkitc-1
          test -d "$BUILD"

          if [ -f sdkconfig ]; then
            SDKCONFIG=sdkconfig
          else
            SDKCONFIG="$(find . -maxdepth 1 -type f -name 'sdkconfig.*' ! -name 'sdkconfig.defaults' -print -quit)"
          fi

          test -f "$SDKCONFIG"
          echo "Final sdkconfig: $SDKCONFIG"

          grep -E '^CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y$' "$SDKCONFIG"
          grep -E '^CONFIG_ESPTOOLPY_FLASHSIZE=\"16MB\"$' "$SDKCONFIG"
          grep -E '^CONFIG_PARTITION_TABLE_CUSTOM=y$' "$SDKCONFIG"
          grep -E '^CONFIG_PARTITION_TABLE_CUSTOM_FILENAME=\"partitions/partitions.csv\"$' "$SDKCONFIG"
          grep -E '^CONFIG_SR_WN_WN9_ALEXA=y$' "$SDKCONFIG"
          grep -E '^model,.*0x400000' partitions/partitions.csv

          test -f "$BUILD/firmware.bin"
          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.elf"

          MODEL="$BUILD/srmodels/srmodels.bin"
          test -s "$MODEL"

          MODEL_SIZE=$(stat -c %s "$MODEL")
          test "$MODEL_SIZE" -le $((0x400000))
          grep -a -q "wn9_alexa" "$MODEL"

          echo "Firmware: PASS"
          echo "ELF: PASS"
          echo "ESP-SR 2.4.6 model image: PASS"
          echo "WakeNet9 Alexa payload: PASS"
          echo "Model partition capacity (4MiB): PASS"
          echo "Model size: $MODEL_SIZE bytes"

      - name: Audit CA bundle
        run: |
          set -euo pipefail

          BUILD=.pio/build/esp32-s3-devkitc-1
          ELF="$BUILD/firmware.elf"

          if [ -f sdkconfig ]; then
            SDKCONFIG=sdkconfig
          else
            SDKCONFIG="$(find . -maxdepth 1 -type f -name 'sdkconfig.*' ! -name 'sdkconfig.defaults' -print -quit)"
          fi
          test -f "$SDKCONFIG"
          echo "Final sdkconfig: $SDKCONFIG"

          grep -E '^(CONFIG_MBEDTLS_CERTIFICATE_BUNDLE|CONFIG_MBEDTLS_DEFAULT_CERTIFICATE_BUNDLE|CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL|CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_CROSS_SIGNED_VERIFY)=' "$SDKCONFIG"
          test "$(grep -E '^CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y$' "$SDKCONFIG" | wc -l)" -eq 1
          test "$(grep -E '^CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=y$' "$SDKCONFIG" | wc -l)" -eq 1
          test "$(grep -E '^CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_CROSS_SIGNED_VERIFY=y$' "$SDKCONFIG" | wc -l)" -eq 1
          readelf -Ws "$ELF" | grep -E '_binary_x509_crt_bundle_(start|end)'

          echo "CA bundle: PASS"

      - name: Upload firmware and ESP-SR diagnostic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-Firmware-Full
          if-no-files-found: error
          path: |
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            .pio/build/esp32-s3-devkitc-1/bootloader.bin
            .pio/build/esp32-s3-devkitc-1/partitions.bin
            .pio/build/esp32-s3-devkitc-1/firmware.elf
            .pio/build/esp32-s3-devkitc-1/srmodels/srmodels.bin
            sr-source/sr-wakenet-diagnostic.txt
