name: Build ESP32-S3 Firmware

on:
  push:
    branches:
      - main
      - fix/geminiproject
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PlatformIO
        run: pip install platformio

      - name: Check PlatformIO
        run: pio --version

      - name: Check Build Environment
        run: |
          set -euo pipefail
          pio platform show espressif32
          pio pkg list
          pio run -t clean
          pio run

      - name: Build ESP32-S3
        run: pio run

      - name: Audit final sdkconfig, 16MB flash and WakeNet9
        run: |
          set -euo pipefail
          BUILD=.pio/build/esp32-s3-devkitc-1
          test -d "$BUILD"
          if [ -f sdkconfig ]; then SDKCONFIG=sdkconfig; else SDKCONFIG="$(find . -maxdepth 1 -type f -name 'sdkconfig.*' ! -name 'sdkconfig.defaults' -print -quit)"; fi
          test -n "$SDKCONFIG" && test -f "$SDKCONFIG"
          echo "Final sdkconfig: $SDKCONFIG"
          grep -E '^CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y$' "$SDKCONFIG"
          grep -E '^CONFIG_ESPTOOLPY_FLASHSIZE=\"16MB\"$' "$SDKCONFIG"
          grep -E '^CONFIG_PARTITION_TABLE_CUSTOM=y$' "$SDKCONFIG"
          grep -E '^CONFIG_PARTITION_TABLE_CUSTOM_FILENAME=\"partitions/partitions.csv\"$' "$SDKCONFIG"
          grep -E '^model,.*0x400000' partitions/partitions.csv
          grep -E '^CONFIG_SR_WN_WN9_HIESP=y$' "$SDKCONFIG"
          test -f "$BUILD/firmware.bin"
          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.elf"
          echo "Flash size: 16MB PASS"
          echo "Custom partition table: PASS"
          echo "WakeNet9 Hi ESP config: PASS"
          echo "Model partition: 4MB PASS"

      - name: Generate ESP-SR srmodels.bin with official ESP-SR packer
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          BUILD="$PWD/.pio/build/esp32-s3-devkitc-1"
          echo "=== ESP-SR MODEL DIAGNOSTIC ==="
          echo "Python: $(python --version)"
          echo "Build: $BUILD"

          ESP_SR_DIR="$(find "$BUILD/managed_components" -maxdepth 2 -type d -name 'esp-sr' -print -quit)"
          if [ -z "$ESP_SR_DIR" ]; then
            ESP_SR_DIR="$(find .pio -type d -path '*/managed_components/espressif__esp-sr' -print -quit)"
          fi
          test -n "$ESP_SR_DIR"
          test -d "$ESP_SR_DIR"
          echo "ESP-SR component: $ESP_SR_DIR"

          PACKER="$ESP_SR_DIR/model/movemodel.py"
          test -f "$PACKER"
          test -f "$ESP_SR_DIR/model/pack_model.py"
          test -d "$ESP_SR_DIR/model/wakenet_model/wn9_hiesp"
          echo "WakeNet model source: $ESP_SR_DIR/model/wakenet_model/wn9_hiesp"
          find "$ESP_SR_DIR/model/wakenet_model/wn9_hiesp" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

          echo "--- Relevant final sdkconfig ---"
          grep -E '^(CONFIG_SR_WN_|CONFIG_SR_MN_|CONFIG_SR_NSN_|CONFIG_SR_VADN_|CONFIG_ESP_SR_EXTERNAL_MODEL_PATH)' "$BUILD/config/sdkconfig" 2>/dev/null || true
          SDKCONFIG="$BUILD/config/sdkconfig"
          test -f "$SDKCONFIG"

          rm -rf "$BUILD/srmodels"

          echo "--- Running Espressif's own movemodel.py directly ---"
          set +e
          python -u "$PACKER" -d1 "$SDKCONFIG" -d2 "$ESP_SR_DIR" -d3 "$BUILD"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "ESP-SR movemodel.py FAILED with exit code $RC"
            echo "--- Python executable ---"
            command -v python
            python -c 'import sys; print(sys.executable); print(sys.version)'
            echo "--- Packer source header ---"
            sed -n '1,240p' "$PACKER"
            echo "--- Model directory tree ---"
            find "$ESP_SR_DIR/model/wakenet_model/wn9_hiesp" -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
            exit "$RC"
          fi

          MODEL_BIN="$BUILD/srmodels/srmodels.bin"
          test -f "$MODEL_BIN"
          MODEL_SIZE="$(stat -c %s "$MODEL_BIN")"
          echo "ESP-SR model image: $MODEL_BIN"
          echo "ESP-SR model size: $MODEL_SIZE bytes"
          test "$MODEL_SIZE" -gt 0
          test "$MODEL_SIZE" -le $((0x400000))
          test -d "$BUILD/srmodels/wn9_hiesp"
          test -f "$BUILD/srmodels/wn9_hiesp/wn9_index"
          test -f "$BUILD/srmodels/wn9_hiesp/wn9_data"
          echo "WakeNet9 model image: PASS"
          echo "Model partition capacity (4MiB): PASS"
          echo "Official ESP-SR packer: PASS"

      - name: Audit final sdkconfig and CA bundle
        run: |
          set -euo pipefail
          BUILD=.pio/build/esp32-s3-devkitc-1
          if [ -f sdkconfig ]; then SDKCONFIG=sdkconfig; else SDKCONFIG="$(find . -maxdepth 1 -type f -name 'sdkconfig.*' ! -name 'sdkconfig.defaults' -print -quit)"; fi
          ELF="$BUILD/firmware.elf"
          grep -E '^(CONFIG_MBEDTLS_CERTIFICATE_BUNDLE|CONFIG_MBEDTLS_DEFAULT_CERTIFICATE_BUNDLE|CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL|CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_CROSS_SIGNED_VERIFY)=' "$SDKCONFIG"
          test "$(grep -E '^CONFIG_MBEDTLS_CERTIFICATE_BUNDLE=y$' "$SDKCONFIG" | wc -l)" -eq 1
          test "$(grep -E '^CONFIG_MBEDTLS_DEFAULT_CERTIFICATE_BUNDLE=y$' "$SDKCONFIG" | wc -l)" -eq 1
          test "$(grep -E '^CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_DEFAULT_FULL=y$' "$SDKCONFIG" | wc -l)" -eq 1
          test "$(grep -E '^CONFIG_MBEDTLS_CERTIFICATE_BUNDLE_CROSS_SIGNED_VERIFY=y$' "$SDKCONFIG" | wc -l)" -eq 1
          readelf -Ws "$ELF" | grep -E '_binary_x509_crt_bundle_(start|end)'
          test "$(readelf -Ws "$ELF" | grep -c '_binary_x509_crt_bundle_start')" -ge 1
          test "$(readelf -Ws "$ELF" | grep -c '_binary_x509_crt_bundle_end')" -ge 1
          echo "CA bundle Kconfig: PASS"
          echo "Embedded x509 certificate bundle: PASS"

      - name: Final compatibility gate
        run: |
          set -euo pipefail
          BUILD=.pio/build/esp32-s3-devkitc-1
          test -f "$BUILD/firmware.bin"
          test -f "$BUILD/bootloader.bin"
          test -f "$BUILD/partitions.bin"
          test -f "$BUILD/firmware.elf"
          test -f "$BUILD/srmodels/srmodels.bin"
          echo "========================================"
          echo "COMPATIBILITY GATE: PASS"
          echo "ESP32-S3 + 16MB Flash + 8MB OPI PSRAM"
          echo "ESP-IDF 6.0.1 + ESP-SR 2.4.5"
          echo "WakeNet9 Hi ESP + official srmodels.bin"
          echo "CA bundle + embedded TLS trust store"
          echo "========================================"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ESP32S3-Firmware-Full
          if-no-files-found: error
          path: |
            .pio/build/esp32-s3-devkitc-1/firmware.bin
            .pio/build/esp32-s3-devkitc-1/bootloader.bin
            .pio/build/esp32-s3-devkitc-1/partitions.bin
            .pio/build/esp32-s3-devkitc-1/firmware.elf
            .pio/build/esp32-s3-devkitc-1/srmodels/srmodels.bin
