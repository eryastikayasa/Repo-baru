name: Decode WakeNet ELF

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build workflow run ID containing ESP32S3-Firmware-Full"
        required: true
        type: string
      artifact_name:
        description: "Artifact name from the build run"
        required: true
        default: "ESP32S3-Firmware-Full"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  decode:
    name: Decode WakeNet crash area
    runs-on: ubuntu-latest

    steps:
      - name: Download exact build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(inputs.run_id) }}

      - name: Locate ELF
        run: |
          set -euo pipefail
          ELF=$(find artifact -type f -name 'firmware.elf' -print -quit)
          test -n "$ELF"
          echo "ELF=$ELF" >> "$GITHUB_ENV"
          echo "Found exact build ELF: $ELF"
          ls -lh "$ELF"
          file "$ELF"

      - name: Install matching ESP32-S3 toolchain
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip platformio
          pio pkg install --global -t "platformio/toolchain-xtensa-esp-elf@15.2.0+20251204"
          echo "=== Installed Xtensa toolchain packages ==="
          pio pkg list --global --only-tools | grep -E 'xtensa|esp-elf' || true

      - name: Locate Xtensa tools
        run: |
          set -euo pipefail
          OBJDUMP=$(find "$HOME/.platformio/packages" -type f \
            \( -name 'xtensa-esp32s3-elf-objdump' -o -name 'xtensa-esp-elf-objdump' -o -name 'xtensa-esp32-elf-objdump' \) \
            -print -quit)
          ADDR2LINE=$(find "$HOME/.platformio/packages" -type f \
            \( -name 'xtensa-esp32s3-elf-addr2line' -o -name 'xtensa-esp-elf-addr2line' -o -name 'xtensa-esp32-elf-addr2line' \) \
            -print -quit)
          test -n "$OBJDUMP"
          test -n "$ADDR2LINE"
          echo "OBJDUMP=$OBJDUMP" >> "$GITHUB_ENV"
          echo "ADDR2LINE=$ADDR2LINE" >> "$GITHUB_ENV"
          "$OBJDUMP" --version
          "$ADDR2LINE" --version | head -n 1

      - name: Decode exact crash and backtrace
        run: |
          set -euo pipefail
          {
            echo "=== ELF ==="
            echo "$ELF"
            echo
            echo "=== ADDR2LINE: EXACT CRASH PC + BACKTRACE ==="
            "$ADDR2LINE" -e "$ELF" -f -C -p \
              0x4205fef8 0x4205fef5 0x42060564 0x420034bd \
              0x42003d95 0x42013520 0x420c6686
            echo
            echo "=== SYMBOLS: WakeNet model_create ==="
            "$OBJDUMP" -t "$ELF" | grep -E 'model_create|wakenet9(_quantized)?|wakenet9l' | head -n 160 || true
          } | tee addr2line-report.txt

      - name: Disassemble exact WakeNet crash area
        run: |
          set -euo pipefail
          {
            echo "=== DISASSEMBLY 0x4205fee0..0x4205ff30 ==="
            "$OBJDUMP" -d --start-address=0x4205fee0 --stop-address=0x4205ff30 "$ELF"
            echo
            echo "=== DISASSEMBLY 0x42060520..0x42060590 ==="
            "$OBJDUMP" -d --start-address=0x42060520 --stop-address=0x42060590 "$ELF"
            echo
            echo "=== DWARF LINE TABLE: wakenet9_quantized.c ==="
            "$OBJDUMP" --dwarf=decodedline "$ELF" 2>/dev/null | grep -A12 -B12 'wakenet9_quantized.c' | head -n 220 || true
          } | tee disassembly-report.txt

      - name: Save final diagnostic report
        run: |
          set -euo pipefail
          {
            echo "WakeNet crash diagnostic"
            echo "========================"
            cat addr2line-report.txt
            echo
            cat disassembly-report.txt
            echo
            echo "NOTE: ESP-SR 2.4.6 can ship WakeNet implementation as a prebuilt binary; the original C source may not exist in the build artifact."
            echo "The ELF DWARF information is therefore the authoritative source/line mapping for this exact firmware."
          } > wakenet-crash-disassembly.txt
          cat wakenet-crash-disassembly.txt

      - name: Upload disassembly report
        uses: actions/upload-artifact@v4
        with:
          name: WakeNet-ELF-Disassembly
          path: |
            wakenet-crash-disassembly.txt
            addr2line-report.txt
            disassembly-report.txt
          if-no-files-found: error
