name: Inspect WN iface and model coeff

on: workflow_dispatch

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: espressif/esp-sr
          ref: 5fadfbd5bd9df756f543973bd43520d9270ffb1b
          path: esp-sr

      - name: Print esp_wn_iface.h
        run: sed -n '1,220p' esp-sr/src/include/esp_wn_iface.h

      - name: Search model_iface_data_t definition
        run: grep -R -n -B5 -A30 "model_iface_data_t" esp-sr --include='*.h' | head -200

      - name: Search model_coeff_getter_t
        run: grep -R -n -B5 -A30 "model_coeff_getter_t" esp-sr --include='*.h' | head -200
