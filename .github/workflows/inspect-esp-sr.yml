name: Inspect srmodel_data_t Definition

on: workflow_dispatch

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ESP-SR commit
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-sr
          ref: 5fadfbd5bd9df756f543973bd43520d9270ffb1b
          path: esp-sr

      - name: Print model_iface_data_t definition
        run: |
           echo "=== Searching model_iface_data_t in ESP-SR ==="
           grep -R -n -B5 -A40 "model_iface_data_t" esp-sr --include='*.h' | head -200
