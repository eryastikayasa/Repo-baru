name: WakeNet9 Runtime Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wakenet-audit.yml'
      - 'platformio.ini'
      - 'scripts/**'
      - 'main/**'
      - 'sdkconfig.defaults'
      - 'components/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup PlatformIO
        run: |
          pip install -U platformio
          pio pkg install

      - name: Build firmware
        run: pio run

      - name: Find and print wakenet9_quantized.c lines
        run: |
          FILE=$(find ~/.platformio -name 'wakenet9_quantized.c' | head -n 1)
          if [ -z "$FILE" ]; then
            echo "File not found in PlatformIO packages"
            # fallback: search entire workspace
            FILE=$(find . -name 'wakenet9_quantized.c' | head -n 1)
          fi
          echo "Found: $FILE"
          if [ -z "$FILE" ]; then
            echo "ERROR: wakenet9_quantized.c not found"
            exit 1
          fi
          sed -n '330,365p' "$FILE"
