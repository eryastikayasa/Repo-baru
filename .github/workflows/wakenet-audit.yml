name: WakeNet9 Runtime Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wakenet-audit.yml'
      - 'platformio.ini'
      - 'scripts/**'
      - 'main/**'
      - 'sdkconfig.defaults'
      - 'components/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify wakeword script is configured
        shell: bash
        run: |
          grep -q 'extra_scripts.*prepare_wakeword.py' platformio.ini
          echo "prepare_wakeword.py is configured in platformio.ini"

      - name: Check Alexa model reference
        shell: bash
        run: |
          grep -RIn --exclude-dir=.git 'wn9_alexa' main/ components/ scripts/ platformio.ini sdkconfig.defaults
          echo "Found wn9_alexa reference"

      - name: Check no HIESP references
        shell: bash
        run: |
          if grep -RIn --exclude-dir=.git 'wn9_hiesp' main/ sdkconfig.defaults; then
            echo "Found wn9_hiesp reference; aborting"
            exit 1
          fi
          echo "No wn9_hiesp reference found in main/ or sdkconfig.defaults"

      - name: Checkout ESP-SR v2.4.5
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-sr
          ref: v2.4.5
          path: esp-sr

      - name: Print line 340-355
        shell: bash
        run: |
          FILE=$(find esp-sr -name 'wakenet9_quantized.c' -type f | head -n 1)
          echo "File found: $FILE"
          if [ -z "$FILE" ]; then
            echo "ERROR: wakenet9_quantized.c not found in ESP-SR v2.4.5"
            exit 1
          fi
          echo "=== ESP-SR v2.4.5: wakenet9_quantized.c lines 340-355 ==="
          nl -ba "$FILE" | sed -n '340,355p'
