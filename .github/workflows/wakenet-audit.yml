name: WakeNet9 Runtime Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wakenet-audit.yml'
      - 'platformio.ini'
      - 'scripts/**'
      - 'main/**'
      - 'sdkconfig.defaults'
      - 'components/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify wakeword script is configured
        shell: bash
        run: |
          grep -q 'extra_scripts.*prepare_wakeword.py' platformio.ini
          echo "prepare_wakeword.py is configured in platformio.ini"

      - name: Check Alexa model reference
        shell: bash
        run: |
          grep -RIn --exclude-dir=.git 'wn9_alexa' main/ components/ scripts/ platformio.ini sdkconfig.defaults
          echo "Found wn9_alexa reference"

      - name: Check no HIESP references
        shell: bash
        run: |
          if grep -RIn --exclude-dir=.git 'wn9_hiesp' main/ sdkconfig.defaults; then
            echo "Found wn9_hiesp reference; aborting"
            exit 1
          fi
          echo "No wn9_hiesp reference found in main/ or sdkconfig.defaults"

      - name: Install ESP Component Manager
        shell: bash
        run: |
          python -m pip install --upgrade idf-component-manager
          compote version

      - name: Fetch ESP-SR v2.4.5 from Component Registry
        shell: bash
        run: |
          rm -rf esp-sr-registry
          compote registry sync esp-sr-registry \
            --component 'espressif/esp-sr==2.4.5' \
            --resolution latest
          SRC=$(find esp-sr-registry -type f -path '*/src/wakenet/wakenet9_quantized.c' | head -n 1)
          test -n "$SRC"
          echo "ESP-SR source: $SRC"
          echo "$SRC" > /tmp/esp_sr_source_path

      - name: Print wakenet9_quantized.c lines 340-355
        shell: bash
        run: |
          SRC=$(cat /tmp/esp_sr_source_path)
          echo "=== ESP-SR v2.4.5: wakenet9_quantized.c lines 340-355 ==="
          nl -ba "$SRC" | sed -n '340,355p'
