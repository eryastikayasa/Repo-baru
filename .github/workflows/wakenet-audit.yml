name: WakeNet9 Runtime Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wakenet-audit.yml'
      - 'platformio.ini'
      - 'scripts/**'
      - 'main/**'
      - 'components/**'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Verify wakeword script is configured
        shell: bash
        run: |
          grep -Eq 'extra_scripts[[:space:]]*=.*prepare_wakeword\.py|extra_scripts.*prepare_wakeword\.py' platformio.ini
          echo "prepare_wakeword.py is configured in platformio.ini"

      - name: Run PlatformIO build
        run: pio run

      - name: Verify Alexa model references
        shell: bash
        run: |
          grep -RIn --exclude-dir=.git 'wn9_alexa' main components scripts platformio.ini || true
          if grep -RIn --exclude-dir=.git 'wn9_hiesp' main components scripts platformio.ini; then
            echo 'ERROR: stale wn9_hiesp reference found in source/configuration.'
            exit 1
          fi
          echo 'No stale wn9_hiesp source/configuration reference found.'
