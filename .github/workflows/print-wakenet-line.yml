name: Print Wakenet Line

on: workflow_dispatch

jobs:
  print-line:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo Anda
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Install library dependencies only
        run: pio pkg install

      - name: Find wakenet9_quantized.c and print lines 340-355
        run: |
          FILE=$(find ~/.platformio -name 'wakenet9_quantized.c' | head -n 1)
          if [ -z "$FILE" ]; then
            # fallback: cari di direktori kerja
            FILE=$(find . -name 'wakenet9_quantized.c' | head -n 1)
          fi
          echo "File ditemukan: $FILE"
          if [ -z "$FILE" ]; then
            echo "ERROR: wakenet9_quantized.c tidak ditemukan"
            exit 1
          fi
          sed -n '340,355p' "$FILE"
